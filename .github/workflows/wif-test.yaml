name: WIF smoke test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/345708018467/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-blogger-publisher@blog-infra.iam.gserviceaccount.com
      - name: read secret
        run: |
          TOKEN=$(gcloud secrets versions access latest --secret=blogger-oauth-client-id --project=blog-infra)
          echo "secret read ok, length=${#TOKEN}"
